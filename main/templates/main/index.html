<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webová Aplikace pro TK Rozrazil</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container">
    
    <nav class="panel">
        <div class="panel-content">
            <h2>Menu</h2>
            <ul class="menu-list">
                <li>O mě</li>
                <li>Šifry</li>
                <li>Uzly</li>
                <li>Test</li>
                <li>Výsledky testu</li>
            </ul>
        </div>
    </nav>

    <main class="panel">
        <div class="panel-content">
            <p class="placeholder-text">Vyberte sekci z menu...</p>
        </div>
    </main>

    <aside class="panel">
        <div class="panel-content">
            <h2>Přihlášení</h2>
            <div class="login-form">
                <label for="username">Uživatel</label>
                <input type="text" id="username" placeholder="Jméno">
                
                <label for="password">Heslo</label>
                <input type="password" id="password" placeholder="Heslo">
                
                <button class="btn-login" onclick="alert('Zatím neaktivní')">
                    Vstoupit
                </button>
            </div>
        </div>
    </aside>

</div>

</body>
</html>
